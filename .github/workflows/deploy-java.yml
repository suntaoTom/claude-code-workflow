# Java Deploy（GitHub Actions）
name: Java Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options: [staging, production]
      version:
        description: 'artifact/image 版本'
        required: true
        type: string
      platform:
        description: '部署目标由仓库环境变量定义'
        required: true
        type: choice
        options: [container, kubernetes, vm]
        default: container

concurrency:
  group: java-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if [ -f workspace/pom.xml ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ workspace/pom.xml 不存在，无法执行 Java 部署"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: workspace/pom.xml
      - name: Verify and package
        run: |
          ./tools/backend.sh validate
          ./tools/backend.sh spotless:check
          ./tools/backend.sh test
          ./tools/backend.sh verify
          ./tools/backend.sh package
          sha256sum workspace/target/*.jar
      - name: Build image
        run: docker build --tag "${{ vars.IMAGE_NAME }}:${{ inputs.version }}" workspace
      - name: Verify image metadata
        run: docker image inspect "${{ vars.IMAGE_NAME }}:${{ inputs.version }}" --format '{{.Id}}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Block unconfigured deployment
        shell: bash
        run: |
          echo "::error::Java deployment adapter is not configured for platform '${{ inputs.platform }}'."
          echo "Configure a reviewed, fixed-path adapter and artifact/image handoff before enabling deployment."
          echo "Required post-deploy checks: /actuator/health, readiness, critical API, WebSocket /ws."
          exit 1
