# Claude Fix — Java 后端故障自动修复入口
# 具体分诊和修复规则在 .claude/commands/bug-check.md、fix.md。
name: Claude Fix

"on":
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      bug_description:
        description: '脱敏的故障描述、复现步骤和错误摘要'
        required: true
        type: string
      allow_pr:
        description: '是否允许创建 draft PR'
        required: false
        default: false
        type: boolean

concurrency:
  group: claude-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@claude fix') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Acknowledge
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 Java 后端 /fix 已启动。日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Run /fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /fix --headless${{ (github.event_name == 'workflow_dispatch' && inputs.allow_pr == true) && ' --pr' || '' }}

            触发来源：${{ github.event_name }}；触发人：@${{ github.actor }}
            只使用脱敏故障信息，不读取或输出 Secret、Token、Cookie、连接串和完整业务 Payload。
            ${{ github.event_name == 'issue_comment' && format('Issue: {0}\n正文:\n{1}\n评论:\n{2}', github.event.issue.title, github.event.issue.body, github.event.comment.body) || inputs.bug_description }}
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./tools/backend.sh *),Bash(java -version),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git checkout -b fix/*),Bash(git checkout fix/*),Bash(git add workspace/*),Bash(git add docs/*),Bash(git commit:*),Bash(git push -u origin fix/*),Bash(gh pr create:*)"
            --disallowedTools "Bash(git push -f *),Bash(git push --force *),Bash(git reset --hard *),Bash(git checkout main*),Bash(git checkout master*),Bash(rm -rf *),Bash(git add .github/*),Bash(git add .claude/*)"
