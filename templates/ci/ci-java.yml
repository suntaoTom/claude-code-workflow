# Java CI 模板（可选安装）
name: Java CI

on:
  push:
    branches: [main, master, dev, test]
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if [ -f workspace/pom.xml ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ workspace/pom.xml 不存在，跳过 Java CI"
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: workspace/pom.xml
      - name: Maven validate
        run: ./tools/backend.sh validate
      - name: Spotless check
        run: ./tools/backend.sh spotless:check
      - name: Test
        run: ./tools/backend.sh test
      - name: Verify
        run: ./tools/backend.sh verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports-${{ github.sha }}
          path: workspace/target/surefire-reports/
          if-no-files-found: ignore
